<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage an existing video from a worker</title>
    <style>
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      video {
        display: block;
        width: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h1>Manage an existing &lt;video&gt; from a worker</h1>
    <p>
      This is a regular video on the page. A Web Worker took control of it and jumps to a random frame every second.
    </p>
    <video id="player" muted src="bunny.webm"></video>
    <p id="log">Waiting for the worker…</p>
    <p><small>Big Buck Bunny © Blender Foundation, CC BY 3.0.</small></p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
